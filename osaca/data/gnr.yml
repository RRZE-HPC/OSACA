# assume all jmp instruction 0
- name: [jo, jno, js, jns, jp, jpe, jnp, jpo]
  operands:
  - class: identifier
  throughput: 0.0
  latency: 0.0
  port_pressure: []
- name: [jc, jb, jae, jnb, jna, jbe, ja, jnbe]
